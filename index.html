<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>介護情報基盤・介護プランデータ連携システム トラブルシューティング検索</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-900">介護情報基盤・データ連携 トラブルシューティング</h1>
                    <p class="text-xs text-slate-500">口語・ニュアンス対応スマート検索サポート（介護プランデータ連携システム対応）</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-600 rounded-full animate-pulse"></span>
                    拡張シソーラス・あいまい検索稼働中
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
        <!-- Search Hero Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 mb-8">
            <label for="searchInput" class="block text-sm font-bold text-slate-700 mb-2">お困りの症状やエラー、日常的な言い回しを入力してください</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" 
                    placeholder="例: 「送信できない」「ログイン画面に入れない」「証明書エラー」「重い・遅い」「パスワード忘れた」など" 
                    class="w-full pl-11 pr-24 py-3.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-sm sm:text-base">
                <div class="absolute inset-y-1.5 right-1.5 flex items-center">
                    <button id="clearBtn" class="hidden px-3 py-1.5 text-xs font-medium text-slate-500 hover:text-slate-700 bg-slate-200 hover:bg-slate-300 rounded-lg transition-colors mr-1">クリア</button>
                </div>
            </div>

            <!-- Quick Tags / Suggestions -->
            <div class="mt-4 flex flex-wrap items-center gap-2">
                <span class="text-xs font-medium text-slate-500">クイック検索:</span>
                <button onclick="setQuery('送信できない')" class="px-3 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs rounded-lg border border-slate-200 transition-colors">送信できない</button>
                <button onclick="setQuery('ログインできない')" class="px-3 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs rounded-lg border border-slate-200 transition-colors">ログインできない</button>
                <button onclick="setQuery('証明書エラー')" class="px-3 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs rounded-lg border border-slate-200 transition-colors">証明書エラー</button>
                <button onclick="setQuery('画面が固まる')" class="px-3 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs rounded-lg border border-slate-200 transition-colors">画面が固まる</button>
                <button onclick="setQuery('重い・遅い')" class="px-3 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs rounded-lg border border-slate-200 transition-colors">重い・遅い</button>
                <button onclick="setQuery('パスワード忘れた')" class="px-3 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 text-xs rounded-lg border border-slate-200 transition-colors">パスワード忘れた</button>
            </div>
            
            <!-- Expansion Notification Box -->
            <div id="expansionNotice" class="mt-4 hidden p-3 bg-emerald-50 border border-emerald-100 rounded-xl text-xs text-emerald-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="expansionText">ニュアンス検索展開中</span>
                </div>
            </div>
        </div>

        <!-- Search Results Section -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">検索結果 (<span id="resultCount">0</span>件)</h2>
                <div class="text-xs text-slate-500">介護プランデータ連携・情報基盤システム対応Q&amp;A</div>
            </div>

            <div id="resultsContainer" class="space-y-4">
                <!-- Dynamic Results Inserted Here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden bg-white border border-slate-200 rounded-2xl p-12 text-center">
                <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h3 class="text-base font-bold text-slate-800 mb-1">一致する項目が見つかりませんでした</h3>
                <p class="text-xs text-slate-500 max-w-md mx-auto mb-4">キーワードを変えるか、より短い単語（例：「送信」「エラー」「証明書」など）でお試しください。</p>
                <button onclick="clearSearch()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-medium transition-colors shadow-sm">すべてのトラブルシューティングを表示</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 介護情報基盤・介護プランデータ連携システム サポートデスク. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Advanced Synonym & Semantic Search -->
    <script>
        // Comprehensive Troubleshooting Data for Care Information Infrastructure & Care Plan Data Collaboration System
        const kbData = [
            {
                id: 1,
                title: "ケアプランデータ・XMLファイルの送信ができない / 未送信になる",
                system: "介護プランデータ連携システム",
                category: "送信・データ連携",
                tags: ["送信できない", "未送信", "送信失敗", "送れない", "エラー", "タイムアウト", "アップロードできない", "データ連携エラー"],
                description: "居宅介護支援事業所から地域包括支援センターや施設へケアプランデータを送信する際、処理が止まり「未送信」ステータスになる、または「送信失敗」エラーになる現象。",
                steps: [
                    "ネットワーク接続および介護情報基盤へのアクセスが正常か確認してください。",
                    "送信するXMLデータが指定された標準仕様・スキーマに準拠しているか確認してください。",
                    "ファイルサイズが上限（通常制限値）を超えていないか、不要な文字が含まれていないか確認してください。",
                    "システム混雑による一時的なタイムアウトの可能性があります。数分待ってから「未送信一覧」より再送をお試しください。"
                ],
                status: "重要"
            },
            {
                id: 2,
                title: "ログイン画面に入れない / 認証エラー・パスワードを忘れた場合",
                system: "共通基盤・共通ポータル",
                category: "認証・アカウント",
                tags: ["ログインできない", "ログイン画面に入れない", "認証失敗", "パスワード忘れた", "入れない", "ログインエラー", "ID失念"],
                description: "システムのログイン画面を開けない、あるいはIDやパスワードを入力しても「認証に失敗しました」と表示されてシステムに入れない場合。",
                steps: [
                    "ブラウザのURL（ブックマーク）が古い可能性があります。公式のポータルURLからアクセスし直してください。",
                    "ID（事業所ID・利用者ID）およびパスワードに半角・全角や大文字・小文字の誤りがないかご確認ください。",
                    "パスワードを失念した場合は、ログイン画面の「パスワードをお持ちでない方・お忘れの方」から再発行手続きを行ってください。"
                ],
                status: "よくある質問"
            },
            {
                id: 3,
                title: "電子証明書の有効期限切れ・証明書エラーについて",
                system: "介護情報基盤",
                category: "セキュリティ・証明書",
                tags: ["証明書", "証明書エラー", "期限切れ", "電子証明書", "ICカード", "セキュリティ警告", "SSLエラー"],
                description: "電子証明書の有効期限が切れている、またはブラウザや端末が電子証明書を正しく認識せず「証明書エラー」「信頼できない接続」と表示される。",
                steps: [
                    "電子証明書（ICカードまたはファイル形式）の有効期限が切れていないか発行元・管理画面より確認してください。",
                    "期限切れの場合は、速やかに電子証明書の更新・再発行手続きを実施してください。",
                    "ブラウザや専用クライアントソフトに最新のルート証明書・中間証明書がインポートされているか確認してください。"
                ],
                status: "要確認"
            },
            {
                id: 4,
                title: "画面が固まる・フリーズする・動作が重い・遅い",
                system: "全般システム",
                category: "パフォーマンス",
                tags: ["画面が固まる", "重い", "遅い", "フリーズ", "動かない", "固まった", "応答なし", "重い・遅い"],
                description: "ケアプランの一覧表示や検索、データ読み込み時に画面が動かなくなったり（フリーズ）、処理に極端に時間がかかる現象。",
                steps: [
                    "ブラウザのキャッシュおよびCookieを削除し、一度ブラウザを再起動してください。",
                    "同時に複数のタブや大量のデータを一度に処理している場合は、件数を絞って検索してください。",
                    "回線速度が低下している、またはサーバー側でアクセス集中が発生している可能性があります。時間をおいてアクセスしてください。"
                ],
                status: "一般"
            },
            {
                id: 5,
                title: "利用者情報のダウンロード・インポートができない",
                system: "介護プランデータ連携システム",
                category: "データ取り込み",
                tags: ["ダウンロードできない", "インポートエラー", "取り込めない", "ファイルエラー", "データ反映されない", "エラーが出る"],
                description: "他事業所から連携されたケアプランデータやCSV/XMLファイルをダウンロード・取り込みしようとするとエラーが発生する。",
                steps: [
                    "ファイル形式がシステムでサポートされている拡張子（.xml, .csv等）であることを確認してください。",
                    "利用者の受給者番号や被保険者番号に誤り・欠損がないか確認してください。",
                    "ブラウザのポップアップブロック機能が有効になっており、ダウンロードがブロックされていないか確認してください。"
                ],
                status: "解決可能"
            },
            {
                id: 6,
                title: "「予期せぬエラーが発生しました（エラーコード: 500/403）」と表示される",
                system: "共通基盤",
                category: "システムエラー",
                tags: ["エラーが出る", "エラーコード", "予期せぬエラー", "システムエラー", "アクセス拒否", "403", "500"],
                description: "操作の途中で突然ポップアップや画面全体にシステムエラーメッセージやエラーコードが表示される。",
                steps: [
                    "一度ログアウトし、ブラウザを完全に閉じてから再度ログインし直してください。",
                    "ブラウザの拡張機能（アドブロック等）がシステムスクリプトをブロックしていないか確認してください。",
                    "エラーコードと発生時刻を控え、システム管理者またはサポートデスクにお問い合わせください。"
                ],
                status: "注意"
            }
        ];

        // Extended Synonym / Nuance Dictionary (口語・日常表現・関連ワードのマッピング)
        const synonymDictionary = {
            "送信できない": ["未送信", "送信失敗", "送れない", "エラー", "タイムアウト", "アップロードできない", "データ連携エラー"],
            "未送信": ["送信できない", "送信失敗", "送れない", "エラー"],
            "送信失敗": ["送信できない", "未送信", "送れない", "エラー"],
            "ログインできない": ["ログイン画面に入れない", "入れない", "認証失敗", "パスワード忘れた", "ログインエラー", "ID失念"],
            "ログイン画面に入れない": ["ログインできない", "入れない", "認証失敗", "ログインエラー"],
            "入れない": ["ログインできない", "ログイン画面に入れない", "認証失敗"],
            "パスワード忘れた": ["ログインできない", "認証失敗", "ID失念"],
            "証明書": ["証明書エラー", "期限切れ", "電子証明書", "ICカード", "セキュリティ警告", "SSLエラー"],
            "証明書エラー": ["証明書", "期限切れ", "電子証明書", "ICカード", "セキュリティ警告"],
            "期限切れ": ["証明書", "証明書エラー", "電子証明書"],
            "重い・遅い": ["重い", "遅い", "画面が固まる", "フリーズ", "動かない", "固まった", "応答なし"],
            "重い": ["重い・遅い", "遅い", "画面が固まる", "フリーズ"],
            "遅い": ["重い・遅い", "重い", "画面が固まる", "フリーズ"],
            "画面が固まる": ["重い", "遅い", "フリーズ", "動かない", "固まった", "応答なし", "重い・遅い"],
            "フリーズ": ["画面が固まる", "重い", "遅い", "動かない", "固まった"],
            "動かない": ["画面が固まる", "フリーズ", "重い", "遅い", "固まった"],
            "固まった": ["画面が固まる", "フリーズ", "重い", "遅い", "動かない"],
            "エラーが出る": ["エラー", "予期せぬエラー", "システムエラー", "エラーコード", "403", "500"],
            "ダウンロードできない": ["インポートエラー", "取り込めない", "ファイルエラー", "データ反映されない"]
        };

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultCount = document.getElementById('resultCount');
        const emptyState = document.getElementById('emptyState');
        const expansionNotice = document.getElementById('expansionNotice');
        const expansionText = document.getElementById('expansionText');

        function setQuery(keyword) {
            searchInput.value = keyword;
            performSearch();
            searchInput.focus();
        }

        function clearSearch() {
            searchInput.value = '';
            performSearch();
            searchInput.focus();
        }

        // Semantic & Fuzzy Search Engine with Synonym Expansion
        function performSearch() {
            const rawQuery = searchInput.value.trim().toLowerCase();
            
            if (rawQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                expansionNotice.classList.add('hidden');
            }

            if (!rawQuery) {
                renderResults(kbData);
                resultCount.textContent = kbData.length;
                emptyState.classList.add('hidden');
                return;
            }

            // 1. Tokenize query
            const queryTokens = rawQuery.split(/[\s　]+/);

            // 2. Expand with Synonym Dictionary
            let expandedKeywords = new Set(queryTokens);
            let appliedSynonyms = [];

            queryTokens.forEach(token => {
                for (let [key, syns] of Object.entries(synonymDictionary)) {
                    if (key.toLowerCase().includes(token) || token.includes(key.toLowerCase())) {
                        syns.forEach(s => expandedKeywords.add(s));
                        appliedSynonyms.push(key, ...syns);
                    } else {
                        syns.forEach(s => {
                            if (s.toLowerCase().includes(token) || token.includes(s.toLowerCase())) {
                                expandedKeywords.add(key);
                                syns.forEach(subS => expandedKeywords.add(subS));
                                appliedSynonyms.push(key, ...syns);
                            }
                        });
                    }
                }
            });

            // Notification message generation
            const uniqueSynonyms = Array.from(new Set(appliedSynonyms)).filter(s => !queryTokens.includes(s));
            if (uniqueSynonyms.length > 0) {
                expansionNotice.classList.remove('hidden');
                expansionText.textContent = `「${rawQuery}」の口語表現・ニュアンスを解析：「${uniqueSynonyms.slice(0, 5).join('、')}」等の関連トラブル項目も含めて検索しています。`;
            } else {
                expansionNotice.classList.add('hidden');
            }

            // 3. Scoring & Weighted Matching
            const scoredResults = kbData.map(item => {
                let score = 0;
                const titleLower = item.title.toLowerCase();
                const descLower = item.description.toLowerCase();
                const systemLower = item.system.toLowerCase();
                const categoryLower = item.category.toLowerCase();
                const tagsLower = item.tags.map(t => t.toLowerCase());

                // Exact raw query match
                if (titleLower.includes(rawQuery)) score += 120;
                if (descLower.includes(rawQuery)) score += 40;
                if (systemLower.includes(rawQuery)) score += 60;
                if (categoryLower.includes(rawQuery)) score += 50;

                // Tag direct match
                item.tags.forEach(tag => {
                    const tLower = tag.toLowerCase();
                    if (tLower === rawQuery || tLower.includes(rawQuery) || rawQuery.includes(tLower)) {
                        score += 100;
                    }
                });

                // Expanded keyword matching
                expandedKeywords.forEach(kw => {
                    if (kw.toLowerCase() === rawQuery) return;
                    const kwLower = kw.toLowerCase();
                    if (titleLower.includes(kwLower)) score += 50;
                    if (descLower.includes(kwLower)) score += 20;
                    item.tags.forEach(tag => {
                        if (tag.toLowerCase().includes(kwLower)) score += 45;
                    });
                });

                // Token partial matching fallback
                queryTokens.forEach(token => {
                    if (titleLower.includes(token)) score += 20;
                    if (descLower.includes(token)) score += 10;
                });

                return { item, score };
            });

            // Filter and sort
            const filtered = scoredResults
                .filter(res => res.score > 0)
                .sort((a, b) => b.score - a.score)
                .map(res => res.item);

            renderResults(filtered);
            resultCount.textContent = filtered.length;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        // Render Results HTML
        function renderResults(items) {
            if (items.length === 0) {
                resultsContainer.innerHTML = '';
                return;
            }

            resultsContainer.innerHTML = items.map(item => {
                return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs hover:border-emerald-300 transition-all">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                <span class="px-2.5 py-1 bg-emerald-50 text-emerald-800 text-xs font-semibold rounded-lg border border-emerald-100">${item.system}</span>
                                <span class="px-2.5 py-1 bg-slate-100 text-slate-700 text-xs font-medium rounded-lg">${item.category}</span>
                                <span class="px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-medium rounded-lg border border-amber-100">${item.status}</span>
                            </div>
                            <div class="flex flex-wrap gap-1">
                                ${item.tags.map(tag => `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 text-xs rounded-md">#${tag}</span>`).join('')}
                            </div>
                        </div>
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-2">${highlightText(item.title, searchInput.value)}</h3>
                        <p class="text-xs sm:text-sm text-slate-600 mb-4 leading-relaxed">${item.description}</p>
                        
                        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4">
                            <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center">
                                <svg class="w-4 h-4 mr-1 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                対処手順・確認事項
                            </h4>
                            <ol class="list-decimal list-inside space-y-1.5 text-xs sm:text-sm text-slate-700">
                                ${item.steps.map(step => `<li class="leading-normal">${step}</li>`).join('')}
                            </ol>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function highlightText(text, query) {
            if (!query) return text;
            const escaped = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return text.replace(regex, '<mark class="bg-amber-100 text-amber-900 px-0.5 rounded">$1</mark>');
        }

        searchInput.addEventListener('input', performSearch);
        clearBtn.addEventListener('click', clearSearch);

        window.onload = function() {
            performSearch();
        };
    </script>
</body>
</html>
