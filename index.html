<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ケアプラン連携システム トラブルナレッジ検索</title>
  <!-- Tailwind CSS (デザインフレームワーク) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome (アイコンライブラリ) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { color-scheme: light; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(ellipse at top left, rgba(204, 251, 241, .45), transparent 38rem),
        #f4f7f8;
    }
    button, input, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(13, 148, 136, .35); outline-offset: 2px; }
    .system-tab[aria-pressed="true"] { background:#0f766e; color:#fff; border-color:#0f766e; box-shadow:0 4px 12px rgba(15,118,110,.18); }
    .system-tab[aria-pressed="false"] { background:#fff; color:#475569; border-color:#e2e8f0; }
    .quick-search { transition: background-color .15s ease, transform .15s ease; }
    .quick-search:hover { transform: translateY(-1px); }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-teal-950 via-teal-800 to-emerald-800 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-7 md:py-9 flex flex-col md:flex-row justify-between items-start md:items-center gap-5">
      <div class="flex items-center gap-4">
        <span class="h-12 w-12 shrink-0 rounded-2xl bg-white/10 ring-1 ring-white/20 flex items-center justify-center">
          <i class="fa-solid fa-book-medical text-2xl text-teal-100"></i>
        </span>
        <div>
          <h1 class="text-xl md:text-3xl font-extrabold tracking-tight">介護の手続き・トラブル検索</h1>
          <p class="text-teal-100 text-sm mt-1">ケアプランデータ連携システム と 介護情報基盤</p>
        </div>
      </div>
      <div id="statusBadge" class="bg-white/10 border border-white/20 px-3.5 py-2 rounded-full text-xs font-medium text-teal-50 flex items-center gap-2">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span>
        <span id="statusText">データを確認中</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 -mt-5 md:-mt-6">
    
    <!-- 検索ボックス -->
    <section class="bg-white rounded-3xl shadow-xl shadow-slate-900/5 p-5 md:p-7 mb-6 border border-white">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-5">
        <div>
          <p class="text-[11px] font-bold tracking-[.16em] text-teal-700 uppercase">Knowledge search</p>
          <h2 class="text-lg md:text-xl font-bold text-slate-900 mt-1">知りたいことを検索</h2>
          <p class="text-sm text-slate-500 mt-1">質問・原因・手順・分類から探せます。</p>
        </div>
        <button id="refreshBtn" onclick="fetchData()" class="self-start sm:self-auto inline-flex items-center gap-2 rounded-xl border border-slate-200 px-3.5 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-teal-800 transition-colors">
          <i class="fa-solid fa-rotate-right"></i> 最新データを読み込む
        </button>
      </div>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-teal-700">
          <i class="fa-solid fa-magnifying-glass text-lg"></i>
        </div>
        <input 
          type="text" 
          id="searchInput" 
          aria-label="検索キーワード"
          placeholder="例：初回登録、電子証明書、CSV送信、エラーコード"
          oninput="filterData()"
          class="w-full pl-12 pr-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-base md:text-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition-all duration-200"
        >
        <button id="clearBtn" aria-label="検索語を消去" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 px-4 items-center text-slate-400 hover:text-slate-700">
          <i class="fa-solid fa-circle-xmark text-lg"></i>
        </button>
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <span class="text-xs font-semibold text-slate-500 mr-1">よく使う検索</span>
        <button class="quick-search rounded-full bg-teal-50 px-3 py-1.5 text-xs font-semibold text-teal-800 hover:bg-teal-100" onclick="quickSearch('初期設定')">初期設定</button>
        <button class="quick-search rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-200" onclick="quickSearch('電子証明書')">電子証明書</button>
        <button class="quick-search rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-200" onclick="quickSearch('CSV')">CSV</button>
        <button class="quick-search rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-200" onclick="quickSearch('ログイン')">ログイン</button>
      </div>

      <div class="mt-6 pt-5 border-t border-slate-100">
        <div class="text-xs font-semibold text-slate-500 mb-2.5">検索する情報</div>
        <div class
